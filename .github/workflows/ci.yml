name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.0'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Build
      run: make build

    - name: Run Tests
      run: make test

    - name: Run Coverage
      run: make coverage

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
      - name: Run lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
          make lint
